<!DOCTYPE html>
<html lang="en">
    <meta charset-"UTF-8">
    <title>Synapse Clicker</title>
    <style>
        * {
            margin:0;
            padding:0;
            box-sizing: border-box;

        }
        
        body {
            background: #FDF3E7;
            color: #6B4A2E;
            font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
            height: 100vh;
            display: grid;
            grid-template-rows: 1fr auto;
        }
     
        #fact-bar {
            background: #F3C98A;
            padding: 10px;
            text-align: center;
            font-size: 13px;
            color: #6B4A2E;
        }

        #content {
            display:grid;
            grid-template-columns: 3fr 1fr;

        }

        #main-panel {
            display: flex;
            flex-direction:column;
            align-items: center;
            justify-content: center;
        }
        
        #shop-panel {
            background: #FCE9D0;
            padding: 15px;
            border-left: 3px solid #F3C98A;
        }
    
        #footer {
            background: #F3C98A;
            padding: 10px;
            text-align: center;
            font-size: 13px;
        }
    
    </style>
</head>
<body>

    <div id='fact-bar'>Did you know? Information travels down axons at up to 430km/h </div>
    
    <div id="content">
        <div id="main-panel">
            <h1>0</h1>
            <p>Neurotransmitters</p>
        </div>

        <div id="shop-panel">
            <h2>Shop</h2>
    </div>

    <div id="footer">footer button go here</div>



</body>
</html>
